- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        path: 'C:/Users/qbr/.dsh/.credentials.yaml'
        watch: false
    - id: deepseek-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        reasoningEffort: high
        retryPolicy:
          mode: normal
          maxRetries: 0
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'
    - id: projections
      name: '@deepseek-ai/dsh-session-projection'
    - id: policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
        workspaceRoot: D:/AMD/phase1-validation
    - id: p10-model
      name: 'D:/deepseek-harness/rtl-tools/src/phase1/p10-model.ts'
      config:
        campaignRoot: D:/AMD/phase1-validation/p10-compat-model-v1
        preflightRoot: D:/AMD/phase1-validation/p10-compat-v3
        datasetRoot: D:/AMD/verilog-eval
        settingsFile: D:/deepseek-harness/rtl-tools/phase1/configs/dev.yaml
        p09File: D:/AMD/phase1-validation/p10-compat-model-v1/p09.json
        autoFile: D:/AMD/phase1-validation/p10-compat-model-v1/auto.json
        freezeFile: D:/AMD/phase1-validation/p10-compat-model-v1/freeze.json
        allowUnisolatedAutomatic: false
        model: deepseek-flash
        maxTokens: 8192
        repairMaxTokens: 16384
        forcedActionMaxTokens: 4096
        repairMaxResponseBytes: 262144
        compactThreshold: 0.8
        maxRepairRounds: 3
        temperature: 0
        timeoutMs: 120000
        activeMs: 1200000
        maxResponseBytes: 65536
        compileMs: 60000
        elaborateMs: 60000
        simulationMs: 30000
        totalMs: 300000
        maxArtifactBytes: 268435456
        artifactPollMs: 100
        maxEventBytes: 1048576
