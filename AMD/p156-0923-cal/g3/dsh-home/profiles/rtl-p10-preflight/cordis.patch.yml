- insert:
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'
    - id: projections
      name: '@deepseek-ai/dsh-session-projection'
    - id: policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
        workspaceRoot: 'D:/AMD/phase1-validation'
    - id: preflight
      name: 'D:/deepseek-harness/rtl-tools/src/phase1/p10-preflight.ts'
      config:
        datasetRoot: 'D:/AMD/verilog-eval'
        campaignRoot: 'D:/AMD/phase1-validation/p10-20260918'
        settingsFile: 'D:/deepseek-harness/rtl-tools/phase1/configs/dev.yaml'
        freezeFile: 'D:/AMD/phase1-validation/p10-20260918/freeze.json'
        allowUnisolatedPreflight: false
        compileMs: 60000
        elaborateMs: 60000
        simulationMs: 30000
        totalMs: 300000
        maxArtifactBytes: 268435456
        artifactPollMs: 100
        maxEventBytes: 1048576
