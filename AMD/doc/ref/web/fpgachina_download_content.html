<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="view-transition" content="same-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPGA创新设计赛道 - 下载中心</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/element-ui.css">
    <link rel="stylesheet" href="css/element-fpga.css">
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <style>
        /* 下载中心标题默认单行省略，标签与下载按钮保持完整显示。
           选择器特异性与全局 .notice .notice-list .notice-text .notice-name 系列规则持平，
           页面样式后置加载，同级时后者生效，移动端媒体查询不受影响 */
        .download-list .notice-list .notice-text {
            /* flex 子项默认 min-width: auto，超长标题会把容器撑开挤掉下载按钮，必须置 0 */
            min-width: 0;
            flex: 1;
        }

        .download-list .notice-list .notice-text .notice-name {
            display: flex;
            align-items: center;
            min-width: 0;
            overflow: hidden;
        }

        .download-list .notice-list .notice-text .notice-name p {
            display: block;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .download-list .notice-list .notice-text .notice-name .dage-text {
            flex: none;
            white-space: nowrap;
        }

        .download-list .notice-list .download-text {
            /* 下载按钮不参与压缩，始终完整显示 */
            flex: none;
            white-space: nowrap;
        }
    </style>
    <script src="js/swiper-bundle.min.js"></script>
    <script src="js/vue.js"></script>
    <script src="js/index.js"></script>
    <script type="text/javascript" src="js/jquery-1.10.2.min.js"></script>
    <script src="js/script.js"></script>
    <script type="text/javascript" src="js/js.cookie.min.js"></script>
    <script src="js/jsencrypt.min.js"></script>
    <script src="js/crypto-js.min.js"></script>
    <script src="js/crypto.js"></script>
    <script type="text/javascript" src="js/httpUtils.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/common.js"></script>
</head>

<body>
    <div id="app" v-cloak>

        <section class="content-ny">
            <div class="content-bg wrapper notice" v-loading="loading">
                <div class="download-list">
                    <ul class="notice-list" v-if="list.length > 0">
                        <li v-for="item in list" :key="item.id">
                            <a href="javascript:void(0);">
                                <div class="date-time">
                                    <span class="date">{{ formatDate(item.createTime).monthDay }}</span>
                                    <span>{{ formatDate(item.createTime).year }}</span>
                                </div>
                                <div class="notice-text">
                                    <div class="notice-name">
                                        <span v-if="item.isTop === 1 || item.isTop === '1'" class="dage-text border">{{ t('downloadPinned') }}</span>
                                        <p>{{ item.title }}</p>
                                        <span v-if="item.isEmphasis === '1'" class="dage-text">{{ t('downloadLatest') }}</span>
                                    </div>
                                    <div class="download-text" @click="download(item)">
                                        <span><img src="images/download-icon.png" alt="arrow">{{ downloadingId === item.id ? t('downloadLoading') : t('downloadBtn') }}</span>
                                    </div>
                                </div>
                            </a>
                        </li>
                    </ul>
                    <el-empty v-if="!loading && list.length === 0" :description="t('downloadNoContent')"></el-empty>
                    <div class="page-warp" v-if="total > 0">
                        <el-pagination background
                            layout="total, sizes, prev, pager, next, jumper"
                            :total="total"
                            :page-size="queryParams.pageSize"
                            :page-sizes="[10, 20, 50, 100]"
                            :current-page.sync="queryParams.pageNum"
                            @current-change="handlePageChange"
                            @size-change="handleSizeChange">
                        </el-pagination>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script>
        new Vue({
            el: '#app',
            data: function () {
                return {
                    loading: false,
                    list: [],
                    total: 0,
                    downloadingId: null,
                    queryParams: {
                        pageNum: 1,
                        pageSize: 10
                    }
                }
            },
            created: function () {
                this.getList();
                var self = this;
                window.addEventListener('fpga-lang-changed', function () { self.getList(); });
            },
            methods: {
                t: function (key) {
                    return window.i18n ? window.i18n.t(key) : key;
                },
                getList: function () {
                    var self = this;
                    self.loading = true;
                    httpGet('/cms/file/list', self.queryParams, false, self).then(function (res) {
                        self.loading = false;
                        var result = (res && res.data) || res;
                        var rows = (result && result.rows) || [];
                        // 置顶项排在最前面（与 notice.html 置顶逻辑保持一致）
                        self.list = rows.slice().sort(function (a, b) {
                            var aTop = a.isTop === '1' || a.isTop === 1 ? 1 : 0;
                            var bTop = b.isTop === '1' || b.isTop === 1 ? 1 : 0;
                            return bTop - aTop;
                        });
                        self.total = (result && result.total) || 0;
                    }).catch(function (err) {
                        self.loading = false;
                        console.error('下载列表加载失败:', err);
                    });
                },
                handlePageChange: function (page) {
                    this.queryParams.pageNum = page;
                    this.getList();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },
                handleSizeChange: function (size) {
                    this.queryParams.pageSize = size;
                    this.queryParams.pageNum = 1;
                    this.getList();
                },
                download: function (item) {
                    var self = this;
                    if (!item.file) {
                        errorMessage(self.t('downloadInvalidFile'));
                        return;
                    }
                    self.downloadingId = item.id;
                    // 通知后端下载计数，然后在新窗口打开文件
                    httpGet('/cms/file/download/' + item.id, {}, false, self).then(function () {
                        self.downloadingId = null;
                        window.open(item.file, '_blank');
                    }).catch(function () {
                        self.downloadingId = null;
                        // 即使计数失败也打开文件
                        window.open(item.file, '_blank');
                    });
                },
                formatDate: function (dateStr) {
                    if (!dateStr) return { year: '', monthDay: '' };
                    var d = new Date(dateStr);
                    if (isNaN(d.getTime())) return { year: '', monthDay: '' };
                    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                    return {
                        year: String(d.getFullYear()),
                        monthDay: pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                    };
                }
            }
        });
    </script>
</body>

</html>
