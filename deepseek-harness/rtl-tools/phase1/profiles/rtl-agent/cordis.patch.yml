- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        path: 'C:/Users/qbr/.dsh/.credentials.yaml'
        watch: false
    - id: deepseek-extensions
      name: '@deepseek-ai/dsh-deepseek-llm-api-extensions'
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        reasoningEffort: high
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'
    - id: projections
      name: '@deepseek-ai/dsh-session-projection'
    - id: policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: 'D:/AMD'
    - id: comparison
      name: 'D:/deepseek-harness/rtl-tools/src/phase1/comparison.ts'
      config:
        outputRoot: 'D:/AMD/phase1-validation'
        datasetRoot: 'D:/AMD/verilog-eval'
        settingsFile: 'D:/deepseek-harness/rtl-tools/phase1/configs/dev.yaml'
        allowReviewedFullAccess: true
